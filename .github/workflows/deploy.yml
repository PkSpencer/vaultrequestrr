name: Build and Push with Dockerfile

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull code into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub using GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Set up Docker Buildx tool
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build the image using our new Dockerfile and push to Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/musicbot:latest
